<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Holly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5b0cb 0%, #ff6b9d 50%, #e91e63 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255,255,255,0.95);
            font-size: 1.1rem;
        }

        /* Gallery Grid */
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        /* Card Style */
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeInUp 0.6s ease backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(233,30,99,0.3);
        }

        /* Image Container */
        .image-container {
            position: relative;
            overflow: hidden;
            height: 280px;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .gallery-img {
            transform: scale(1.1);
        }

        /* Overlay Gradient Pink */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(233,30,99,0.8), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .overlay {
            transform: translateY(0);
        }

        .overlay span {
            color: white;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Card Content */
        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            color: #e91e63;
            margin-bottom: 8px;
            font-size: 1.4rem;
        }

        .card-content p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .date {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #ff6b9d;
            font-weight: 500;
        }

        /* Modal Lightbox */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            animation: zoomIn 0.4s ease;
        }

        .modal-img {
            width: auto;
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(233,30,99,0.5);
        }

        .modal-caption {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.1);
            color: #ff6b9d;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(233,30,99,0.3);
            color: white;
            border: none;
            font-size: 40px;
            padding: 15px 25px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(233,30,99,0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 30px;
        }

        .next-btn {
            right: 30px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .nav-btn {
                font-size: 25px;
                padding: 10px 15px;
            }
            
            .prev-btn {
                left: 10px;
            }
            
            .next-btn {
                right: 10px;
            }
            
            .close-btn {
                right: 20px;
                top: 10px;
                font-size: 30px;
            }
        }

        /* Loading effect */
        .image-container.loading {
            background: linear-gradient(90deg, #ffe0e6 25%, #ffc0d0 50%, #ffe0e6 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Pink accent untuk tombol dan hover */
        .card:hover .date {
            color: #e91e63;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Galeri Foto Holly </h1>
    </div>

    <div class="gallery" id="gallery">
        <!-- Card 1 -->
        <div class="card" data-index="0">
            <div class="image-container">
                <img src="2.jpg" alt="Holly di Taman" class="gallery-img" loading="lazy">
                <div class="overlay">
                    <span>📸 Lihat Foto</span>
                </div>
            </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card" data-index="1">
            <div class="image-container">
                <img src="3.jpg" alt="Holly di Pantai" class="gallery-img" loading="lazy">
                <div class="overlay">
                    <span>🌊 Lihat Foto</span>
                </div>
            </div>
    
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card" data-index="2">
            <div class="image-container">
                <img src="4.jpg" alt="Holly & Teman" class="gallery-img" loading="lazy">
                <div class="overlay">
                    <span>🎉 Lihat Foto</span>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Modal Lightbox -->
    <div id="modal" class="modal">
        <span class="close-btn">&times;</span>
        <button class="nav-btn prev-btn">❮</button>
        <button class="nav-btn next-btn">❯</button>
        <div class="modal-content">
            <img id="modalImg" class="modal-img" src="" alt="">
            <div id="modalCaption" class="modal-caption"></div>
        </div>
    </div>

    <script>
        // Data foto (bisa ditambah sesuai kebutuhan)
        const photos = [
            {
                src: "https://picsum.photos/id/64/800/600",
                title: "🌸 Holly di Taman Bunga",
                caption: "Senja yang indah ditemani bunga-bunga bermekaran - Taman Bunga, 12 Maret 2024"
            },
            {
                src: "https://picsum.photos/id/15/800/600",
                title: "🏖️ Holly di Pantai",
                caption: "Angin laut dan deburan ombak - Pantai Selatan, 25 Juni 2024"
            },
            {
                src: "https://picsum.photos/id/26/800/600",
                title: "💖 Holly & Teman-teman",
                caption: "Momen kebersamaan penuh tawa - Kafe Nostalgia, 8 September 2024"
            }
        ];

        let currentIndex = 0;
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const closeBtn = document.querySelector('.close-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const cards = document.querySelectorAll('.card');

        // Fungsi untuk membuka modal dengan animasi
        function openModal(index) {
            currentIndex = index;
            const photo = photos[currentIndex];
            modalImg.src = photo.src;
            modalCaption.innerHTML = `<strong>${photo.title}</strong><br>${photo.caption}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Fungsi untuk menutup modal
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Fungsi untuk foto berikutnya
        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            const photo = photos[currentIndex];
            modalImg.style.opacity = '0';
            setTimeout(() => {
                modalImg.src = photo.src;
                modalCaption.innerHTML = `<strong>${photo.title}</strong><br>${photo.caption}`;
                modalImg.style.opacity = '1';
            }, 200);
        }

        // Fungsi untuk foto sebelumnya
        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            const photo = photos[currentIndex];
            modalImg.style.opacity = '0';
            setTimeout(() => {
                modalImg.src = photo.src;
                modalCaption.innerHTML = `<strong>${photo.title}</strong><br>${photo.caption}`;
                modalImg.style.opacity = '1';
            }, 200);
        }

        // Event listener untuk kartu
        cards.forEach((card, idx) => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(idx);
            });
        });

        // Event listener modal
        closeBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', nextPhoto);
        prevBtn.addEventListener('click', prevPhoto);

        // Tutup modal dengan klik di luar gambar
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowRight') {
                nextPhoto();
            } else if (e.key === 'ArrowLeft') {
                prevPhoto();
            }
        });

        // Efek loading untuk gambar
        const images = document.querySelectorAll('.gallery-img');
        images.forEach(img => {
            img.addEventListener('load', () => {
                img.closest('.image-container').classList.remove('loading');
            });
            img.closest('.image-container').classList.add('loading');
        });

        // Tambahkan efek saat halaman dimuat
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
